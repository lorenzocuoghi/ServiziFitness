{% extends "base.html" %}
{% block head %}

    <title>Login</title>

{% endblock %}
{% block body %}

    <div class="col-md-3 mx-auto pt-5 mt-5">
        <div class="border border-dark p-4 rounded shadow">
            <form data-bitwarden-watching="1" method="post">
                {% csrf_token %}
                <h3 class="text-center fw-normal mb-3">Please sign in</h3>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="{{ form.username.id_for_label }}" placeholder="username"
                           name="{{ form.username.html_name }}" maxlength="{{ form.username.field.max_length }}"
                           autofocus required />
                    <label for="{{ form.username.id_for_label }}">Username</label>
                </div>
                <div class="form-floating mb-1">
                    <input type="password" class="form-control" id="{{ form.password.id_for_label }}"
                           placeholder="Password" name="{{ form.password.html_name }}"
                           maxlength="{{ form.username.field.max_length }}" required />
                    <label for="{{ form.password.id_for_label }}">Password</label>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Your username and password didn't match. Please try again.
                    </div>
                {% endif %}

                <p>Don't have an account? <a href="{% url 'accounts:register' %}">SignUp!</a></p>

                <button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
                {% if next %}
                    <input type="hidden" name="next" value="{{ next }}" />
                {% endif %}
            </form>

        </div>
    </div>

{% endblock %}
