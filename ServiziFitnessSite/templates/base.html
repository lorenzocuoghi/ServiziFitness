<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

    {% block head %}{% endblock %}

    <title></title>
</head>
<body>

    <header class="py-3 bg-light border-bottom">
        <div class="container-fluid d-flex flex-wrap justify-content-between">
            <div class="px-2">
                <a href="{% url 'workout:index' %}"><button class="btn btn-outline-primary">Home</button></a>
            </div>
            <div>
                <ul class="nav">
                    {% if user.is_authenticated %}
                        <li class="nav-item"><a href="{% url 'workout:trainingcard_list' %}" class="nav-link px-2 text-dark">My Training Cards</a></li>
                        <li class="nav-item"><a href="{% url 'workout:exercise_list' %}" class="nav-link px-2 text-dark">My Esercises</a></li>
                    {% endif %}
                    <li class="nav-item"><a href="{% url 'workout:trainingcard_search' %}" class="nav-link px-2 text-dark">Find Cards</a></li>
                    <li class="nav-item"><a href="{% url 'workout:exercise_search' %}" class="nav-link px-2 text-dark">Find Esercises</a></li>
                </ul>
            </div>
            <div>
                {% if user.is_authenticated %}
                    <ul class="nav">
                        <li class="nav-item dropdown">
                            <button class="btn btn-outline-light dropdown-toggle text-dark" id="DropdownUserMenu" data-bs-toggle="dropdown" aria-expanded="false">
                                {% if request.user.first_name %}{{ user.first_name }} {{ user.last_name }}{% else %}{{ user }}{% endif %}
                            </button>
                            <ul class="dropdown-menu bg-light" aria-labelledby="DropdownUserMenu">
                                <li><a class="dropdown-item" href="{% url 'accounts:profile' %}">Profile</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="{% url 'logout_view' %}">Sign out</a></li>
                            </ul>
                        </li>
                    </ul>
                {% else %}
                    <ul class="nav">
                        <li class="nav-item">
                            <div class="btn-group me-2" role="group">
                                <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
                                <a href="{% url 'accounts:register' %}" class="btn btn-warning">Sign-up</a>
                            </div>
                        </li>
                    </ul>
                {% endif %}
            </div>
        </div>
    </header>

    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous">
    </script>
</body>
</html>
